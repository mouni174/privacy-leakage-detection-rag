redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#14B8A6", "#60A5FA", "#A78BFA", "#FBBF24", "#F87171", "#34D399", "#94A3B8"]
dataframeHeaderBackgroundColor = "#172235"
dataframeBorderColor = "#29374B"

[theme.sidebar]
backgroundColor = "#121D2E"
secondaryBackgroundColor = "#172235"
borderColor = "#29374B"
