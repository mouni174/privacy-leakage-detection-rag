[theme]
base = "dark"
primaryColor = "#14B8A6"
backgroundColor = "#101827"
secondaryBackgroundColor = "#172235"
codeBackgroundColor = "#111C2D"
textColor = "#F4F7FB"
linkColor = "#2DD4BF"
borderColor = "#29374B"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
